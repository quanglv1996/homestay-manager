version: '3.8'

services:
  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: homestay-backend
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - ./backend-python/data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - homestay-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homestay-frontend
    ports:
      - "0.0.0.0:8989:8989"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - homestay-network

networks:
  homestay-network:
    driver: bridge

volumes:
  data:
